[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
# Gas limit for the P-256 verification path (precompile ~6.9k, Solidity fallback
# ~200k-330k). Spec requires >= 500_000. We keep headroom.
gas_limit = 30000000

remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "forge-std/=lib/forge-std/src/",
]

[fmt]
line_length = 100
tab_width = 4
