[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lastword-agent"
version = "1.0.0"
description = "LASTWORD AI agent: isolated reader + guard (rules-first, Bedrock optional)"
requires-python = ">=3.11"
dependencies = [
    "lastword-proto",
    "jsonschema>=4",
    "requests>=2",
    "python-dotenv>=1",
]

[project.optional-dependencies]
bedrock = ["boto3>=1.34"]
pdf = ["pypdf>=4"]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]
