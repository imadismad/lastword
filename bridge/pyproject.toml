[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lastword-bridge"
version = "1.0.0"
description = "LASTWORD bridge: local API, badge transport, chain submit, journal"
requires-python = ">=3.11"
dependencies = [
    "lastword-proto",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "web3>=6",
    "pyserial>=3.5",
    "pydantic>=2",
    "python-dotenv>=1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]
mesh = ["meshtastic>=2.3"]

[tool.setuptools.packages.find]
where = ["src"]
